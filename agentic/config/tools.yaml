tools:
  add_benefit:
    risk: write
    intents: [beneficiary_management]
    explicit_user_fields: [nafi_iban, short_name]
    required_scopes: [financial:write]
    requires_confirmation: true
    requires_receipt: false
    requires_owner_metadata: true
    idempotent: true
    max_calls_per_task: 2
  list_beneficiaries:
    risk: sensitive_read
    intents: [beneficiary_management, saved_beneficiary_transfer, money_transfer]
    required_scopes: [financial:read]
    requires_owner_metadata: true
    max_calls_per_task: 5
  transfer_between_accounts:
    # Every transfer pauses for the demo OTP after database preflight validates
    # ownership, beneficiary membership, balance, and daily spend limit.
    risk: write
    intents: [saved_beneficiary_transfer, money_transfer]
    # Hackathon UX: the model may resolve a user-stated beneficiary name to an
    # account number from list_beneficiaries. Database preflight still limits
    # the destination to this user's saved Nafi beneficiary list.
    explicit_user_fields: [destination_account, amount]
    required_scopes: [financial:write]
    requires_confirmation: true
    requires_receipt: true
    requires_owner_metadata: true
    idempotent: true
    max_calls_per_task: 8
  analyze_finances:
    risk: sensitive_read
    intents: [financial_calculation, account_information, transaction_search]
    required_scopes: [financial:read]
    requires_owner_metadata: true
    max_calls_per_task: 3
  monthly_report:
    risk: sensitive_read
    intents: [transaction_search, account_information, financial_calculation]
    required_scopes: [financial:read]
    requires_owner_metadata: true
    max_calls_per_task: 3
  create_qatta:
    # beneficiary_management included: qatta requests phrased as "add people
    # to the qatta" classify there, and participants come from that list.
    # financial_action: creation deducts the creator's share into the pot.
    risk: financial_action
    intents: [bill_payment, money_transfer, financial_calculation, beneficiary_management]
    explicit_user_fields: [qatta_name, total_amount, participants]
    required_scopes: [financial:write]
    requires_confirmation: true
    requires_receipt: true
    requires_owner_metadata: true
    idempotent: true
    max_calls_per_task: 2
  pay_qatta_bill:
    risk: financial_action
    intents: [bill_payment, money_transfer]
    explicit_user_fields: [qatta_name]
    required_scopes: [financial:write]
    requires_confirmation: true
    requires_receipt: true
    requires_owner_metadata: true
    idempotent: true
    max_calls_per_task: 2
  send_gift:
    risk: financial_action
    intents: [gift_transfer]
    explicit_user_fields: [recipient, amount, gift_message]
    required_scopes: [financial:write]
    requires_confirmation: true
    requires_receipt: true
    requires_owner_metadata: true
    idempotent: true
    max_calls_per_task: 2
  pay_fatoorah:
    risk: financial_action
    intents: [bill_payment]
    explicit_user_fields: [last_four_digits]
    required_scopes: [financial:write]
    requires_confirmation: true
    requires_receipt: true
    requires_owner_metadata: true
    idempotent: true
    max_calls_per_task: 2
  list_fatoorahs:
    risk: sensitive_read
    intents: [bill_payment, account_information, transaction_search]
    required_scopes: [financial:read]
    requires_owner_metadata: true
    max_calls_per_task: 3
  cancel_qatta:
    # financial_action: cancelling refunds every paid share from the pot.
    risk: financial_action
    intents: [bill_payment, money_transfer, beneficiary_management]
    explicit_user_fields: [qatta_name]
    required_scopes: [financial:write]
    requires_confirmation: true
    requires_receipt: true
    requires_owner_metadata: true
    idempotent: true
    max_calls_per_task: 2
  list_qatta_bills:
    risk: sensitive_read
    intents: [account_information, transaction_search, bill_payment, beneficiary_management]
    required_scopes: [financial:read]
    requires_owner_metadata: true
    max_calls_per_task: 3
  get_balance:
    risk: sensitive_read
    intents: [account_information]
    required_scopes: [financial:read]
    requires_owner_metadata: true
    max_calls_per_task: 3
  search_transactions:
    risk: sensitive_read
    intents: [transaction_search]
    required_scopes: [financial:read]
    requires_owner_metadata: true
    max_calls_per_task: 3
  get_portfolio:
    risk: sensitive_read
    intents: [investment_research]
    required_scopes: [financial:read]
    requires_owner_metadata: true
    max_calls_per_task: 3
  transfer_funds:
    risk: financial_action
    intents: [money_transfer]
    explicit_user_fields: [destination, amount]
    required_scopes: [financial:write]
    requires_confirmation: true
    requires_receipt: true
    requires_owner_metadata: true
    idempotent: true
    max_calls_per_task: 2
  pay_bill:
    risk: financial_action
    intents: [bill_payment]
    explicit_user_fields: [biller, amount]
    required_scopes: [financial:write]
    requires_confirmation: true
    requires_receipt: true
    requires_owner_metadata: true
    idempotent: true
    max_calls_per_task: 2
  add_beneficiary:
    risk: write
    intents: [beneficiary_management]
    explicit_user_fields: [name, account_reference]
    required_scopes: [financial:write]
    requires_confirmation: true
    requires_receipt: false
    requires_owner_metadata: true
    idempotent: true
    max_calls_per_task: 2
  buy_investment:
    risk: financial_action
    intents: [investment_buy, portfolio_modification]
    explicit_user_fields: [symbol, quantity]
    required_scopes: [investment:trade]
    requires_confirmation: true
    requires_receipt: true
    requires_owner_metadata: true
    idempotent: true
    max_calls_per_task: 2
  sell_investment:
    risk: financial_action
    intents: [investment_sell, portfolio_modification]
    explicit_user_fields: [symbol, quantity]
    required_scopes: [investment:trade]
    requires_confirmation: true
    requires_receipt: true
    requires_owner_metadata: true
    idempotent: true
    max_calls_per_task: 2

  withdraw_funds:
    risk: financial_action
    intents: [money_transfer]
    explicit_user_fields: [amount]
    required_scopes: [financial:write]
    requires_confirmation: true
    requires_receipt: true
    requires_owner_metadata: true
    idempotent: true
    max_calls_per_task: 2

# Intent workflows are deterministic discovery/action plans. They let the
# Agentic layer search authoritative user data before it can conclude that an
# approximate entity name is absent or proceed to a confirmed action.
workflows:
  saved_beneficiary_transfer:
    - list_beneficiaries
    - transfer_between_accounts
  gift_transfer:
    - list_beneficiaries
    - send_gift
