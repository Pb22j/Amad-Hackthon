financial_actions:
  require_exact_confirmation:
    - transfer_idle_cash_to_savings
    - transfer_between_accounts
    - fund_nafi_wallet
    - add_benefit
    - send_gift
    - pay_fatoorah
    - create_qatta
    - pay_qatta_bill
    - cancel_qatta
    - transfer_funds
    - buy_investment
    - sell_investment
    - withdraw_funds
    - pay_bill
    - add_beneficiary
  require_authoritative_receipt:
    - transfer_idle_cash_to_savings
    - transfer_between_accounts
    - fund_nafi_wallet
    - send_gift
    - pay_fatoorah
    - create_qatta
    - pay_qatta_bill
    - cancel_qatta
    - transfer_funds
    - pay_bill
    - buy_investment
    - sell_investment
    - withdraw_funds
financial_advisor:
  # The safety values are Literal-validated and cannot be relaxed through deployment config.
  advisory_only: true
  require_authoritative_data: true
  # Advisor reads may need multiple analytical views. The action agent retains
  # each tool's stricter max_calls_per_task value from tools.yaml.
  max_calls_per_tool: 6
  allowed_tool_risks:
    - read
    - sensitive_read
security:
  reject_cross_user_requests: true
  reject_credential_requests: true
  reject_policy_bypass: true
  redact_sensitive_logs: true
  tool_results_are_untrusted: true
  blocked_intents:
    - access_other_user
    - credential_theft
    - fraud
    - money_laundering
    - market_manipulation
    - compliance_bypass
memory:
  allowed_types:
    - preferred_language
    - reporting_currency
    - report_format
    - account_alias
    - user_constraint
  forbidden_key_fragments:
    - password
    - passcode
    - pin
    - otp
    - token
    - secret
    - api_key
    - cvv
    - full_card_number
