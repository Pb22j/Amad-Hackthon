services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: amad
      POSTGRES_USER: amad
      POSTGRES_PASSWORD: development-only-password
    ports:
      # Keep PostgreSQL reachable only from this laptop. The public tunnel must
      # expose the interaction API, never the database.
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amad -d amad"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - amad-postgres:/var/lib/postgresql/data

volumes:
  amad-postgres:
